  body:
  - value: '<p class="uk-text-lead">Every UIkit component is ready for Display Builder: page layouts, entity displays and views.</p><p>Every UIkit component of UI Suite UIkit is a single directory component, with typed props, slots, variants and stories. In Display Builder, you drag them into page layouts, entity displays and views.</p><p>Container components declare the components expected in their slots: accordion items, switcher tabs and panels, table rows and cells, slideshow items. Layouts are variants: <em>Grid: 2 columns</em> offers 50/50, 66/33, 33/66, 75/25 and 25/75.</p>'
