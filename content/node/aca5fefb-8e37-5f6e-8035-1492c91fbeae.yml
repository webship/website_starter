  body:
  - value: <p class="uk-text-lead">Generate a theme of your own from UI Suite UIkit with a single command.</p><p>UI Suite UIkit is a starterkit theme. Generate your own theme from it with <code>php core/scripts/drupal generate-theme my_theme --starterkit ui_suite_uikit</code>.</p><p>The machine name, the label and the CSS class names are renamed, the development files are left out and the new theme gets its own README.</p>
    format: full_html
    summary: Generate a theme of your own from UI Suite UIkit with a single command.
