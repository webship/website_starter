      value: '<p class="uk-text-lead">Full articles rendered as UIkit articles and teasers as cards, straight from the field values.</p><h2>Building pages with Display Builder</h2><p>Display Builder gives site builders a canvas where pages are composed from the components of the design system. The left sidebar lists the components by group — layout, navigation, elements, media — and a component is added by dragging it into a slot of the page.</p><p>Each component comes with a form generated from its definition: variants such as primary or secondary, sizes, alignment, and the content sources for its slots. A slot can hold a block, a field of the current entity, a menu, a view or another component, so complex layouts are assembled without writing a template.</p><p>The builder keeps a history of the changes, previews the result in several viewports and only publishes when the page is ready. Page layouts, content displays and views all use the same tool, which makes the whole site consistent.</p><drupal-media data-entity-type="media" data-entity-uuid="fefff2a3-0011-4d00-83b2-af3fe6c6ad26" data-view-mode="default"></drupal-media><h2>Why UIkit fits content-rich websites</h2><p>UIkit is a modular front-end framework with more than sixty components, from navbars and cards to sliders, lightboxes and sortable lists. Every component is written with the same naming conventions, so once an editor or a developer has seen a card, the modal and the tile feel familiar.</p><p>The framework ships its JavaScript as small, self-initializing components. They watch the page for new markup, which means a card inserted by Display Builder, a slide loaded by HTMX or a modal rendered by a view starts working immediately, without any glue code in the theme.</p><p>Because the look is driven by a handful of global variables — colors, fonts, borders, spacing — a brand can be applied in minutes. The UI Suite UIkit theme exposes those variables as CSS custom properties, so the brand can even be changed from the administration interface.</p><ul><li>Consistent class names for every component</li><li>Components that initialize themselves after any DOM change</li><li>Responsive utilities for width, visibility and spacing</li><li>An icon set of more than 160 SVG icons</li></ul><h2>Design tokens that editors can change</h2><p>A design token is a named decision: the primary background, the muted text color, the border color. In the Website Starter every UIkit color used by the components reads a CSS variable, and the variables are declared for UI Skins.</p><p>Changing the primary color from the CSS variables page recolors the buttons, the active tabs, the links and the progress bars at once. The dark color mode is nothing more than another set of values for the same variables.</p><blockquote><p>Tokens turn a style guide into something a site builder can actually use.</p><footer>A front-end lead, after the first brand workshop</footer></blockquote><h2>Key takeaways</h2><ul><li>Building pages with Display Builder</li><li>Why UIkit fits content-rich websites</li><li>Design tokens that editors can change</li></ul>'
      format: full_html
      summary: 'Full articles rendered as UIkit articles and teasers as cards, straight from the field values.'
