      value: |-
        <p class="uk-text-lead">Keeping the design files and the Drupal components in sync with shared variant names.</p><h2>A workflow for design and development</h2><p>The UIkit components are also drawn in a Penpot design system with the same variant names as the Drupal components. Designers pick a primary button or a card with the image on the left, and the developer finds exactly the same variant in the component library.</p><p>Stories document every component in Drupal, the SDC Devel module validates the definitions, and automated webship-js scenarios check the pages in a real browser. Changes to the design system are therefore visible, reviewed and tested.</p><h2>Design tokens that editors can change</h2><p>A design token is a named decision: the primary background, the muted text color, the border color. In the Website Starter every UIkit color used by the components reads a CSS variable, and the variables are declared for UI Skins.</p><p>Changing the primary color from the CSS variables page recolors the buttons, the active tabs, the links and the progress bars at once. The dark color mode is nothing more than another set of values for the same variables.</p><blockquote><p>Tokens turn a style guide into something a site builder can actually use.</p><footer>A front-end lead, after the first brand workshop</footer></blockquote><h2>From recipe to running site</h2><p>The Website Starter is a Drupal recipe. It installs the content types, the media types, the design system, the page layout and this demo content in one command, on a new site or on an existing Drupal CMS project.</p><p>Recipes are plain configuration and content files, so they can be reviewed, versioned and extended. A project can start from the Website Starter, change a few tokens, rearrange the page layout in Display Builder and ship.</p><pre><code>ddev composer create-project drupal/website my_site
        ddev drush site:install webship -y</code></pre><h2>Key takeaways</h2><ul><li>A workflow for design and development</li><li>Design tokens that editors can change</li><li>From recipe to running site</li></ul>
      format: full_html
      summary: 'Keeping the design files and the Drupal components in sync with shared variant names.'
