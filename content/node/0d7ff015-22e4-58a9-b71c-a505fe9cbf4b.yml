  body:
  - value: '<p class="uk-text-lead">The navbar has left, center and right regions, and an offcanvas menu on small screens.</p><p>The page template builds the header with the UIkit navbar, in three regions: <em>Navbar left</em>, <em>Navbar center</em> and <em>Navbar right</em>. A theme setting makes it sticky.</p><p>On small screens, the navbar toggle opens the <em>Offcanvas</em> region, with the main menu as a UIkit nav.</p>'
