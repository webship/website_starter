  body:
  - value: '<p class="uk-text-lead">Text, colors, margins, flex, shadows and animations: the UIkit utility classes are one click away.</p><p>UI Styles exposes the UIkit utility classes: text, typography, colors, inverse, margin, padding, width, height, flex, position, visibility, box shadow, border radius and animation.</p><p>Pick them for blocks, components and layouts in the Display Builder <em>Styles</em> panel, instead of writing CSS.</p>'
