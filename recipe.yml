name: 'Website Starter'
description: 'A website built with Display Builder and the UI Suite UIkit design system: page layout, Webpage and Web Blog content displays, contact webform, menus, a UIkit showcase and demo content. No Canvas, no Layout Builder.'
type: 'Site'
# Site template metadata for the Drupal CMS installer.
extra:
  drupal_cms_installer:
    creator: 'Webship'
recipes:
  # Webship content types and media, before the roles: the roles reference
  # their permissions. Webpage first: it installs Node.
  - modules/contrib/webpage/recipes/default
  - modules/contrib/webassets/recipes/default
  - modules/contrib/webdev/recipes/default
  - modules/contrib/webblog/recipes/default
  - core/recipes/tags_taxonomy
  # The recipes of core Standard. Standard itself and the Drupal CMS admin UI
  # are not included: they install Navigation, and Navigation and Dashboard
  # require Layout Builder. Their settings are below, without them.
  - core/recipes/basic_block_type
  - core/recipes/basic_html_format_editor
  - core/recipes/full_html_format_editor
  - core/recipes/core_recommended_performance
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_admin_theme
  - core/recipes/core_recommended_front_end_theme
  - core/recipes/user_picture
  - core/recipes/restricted_html_format
  - core/recipes/administrator_role
  - core/recipes/content_editor_role
  # Drupal CMS recipes without Canvas: anti-spam, authentication and basic SEO.
  - drupal_cms_anti_spam
  - drupal_cms_authentication
  - drupal_cms_seo_basic
  # The default dashboards of the Webship site templates, built with Display
  # Builder: Webmaster for site administrators, Editorial for content editors.
  - webdash
  # Webship features: editor, SEO, security and configuration management.
  - modules/contrib/webeditor/recipes/default
  - modules/contrib/webseo/recipes/default
  - modules/contrib/websecurity/recipes/default
  - modules/contrib/webconfig/recipes/default
install:
  # Core Standard, without Navigation.
  - image
  - help
  - config
  - contextual
  - menu_link_content
  - datetime
  - menu_ui
  - options
  - field_ui
  - views_ui
  # Drupal CMS admin UI, without Dashboard and Navigation.
  - announcements_feed
  - automatic_updates
  - coffee
  - dblog
  - drupal_cms_helper
  - drupical
  - file
  - gin
  - gin_login
  - gin_toolbar
  - project_browser
  - sam
  - tagify
  - tagify_user_list
  - update
  - view_password
  # UI Patterns 2.
  - ui_patterns
  - ui_patterns_blocks
  - ui_patterns_field
  - ui_patterns_field_formatters
  - ui_patterns_layouts
  - ui_patterns_library
  - ui_patterns_views
  # UI Styles.
  - ui_styles
  - ui_styles_block
  - ui_styles_library
  - ui_styles_ui_patterns
  # UI Icons.
  - ui_icons
  - ui_icons_library
  - ui_icons_patterns
  # UI Skins.
  - ui_skins
  # Display Builder.
  - display_builder
  - display_builder_entity_view
  - display_builder_page_layout
  - display_builder_ui
  - display_builder_views
  # Forms.
  - webform
  - webform_ui
  # Theme.
  - ui_suite_uikit
config:
  strict: false
  import:
    # Core Standard.
    claro:
      - block.block.claro_help
      - block.block.claro_breadcrumbs
      - block.block.claro_content
      - block.block.claro_local_actions
      - block.block.claro_messages
      - block.block.claro_page_title
      - block.block.claro_primary_local_tasks
      - block.block.claro_secondary_local_tasks
    image:
      - image.style.large
      - image.style.thumbnail
    node:
      - views.view.archive
      - views.view.content
      - views.view.content_recent
      - views.view.frontpage
      - views.view.glossary
    olivero:
      - block.block.olivero_help
    user:
      - core.entity_view_mode.user.compact
      - views.view.user_admin_people
      - views.view.who_s_new
      - views.view.who_s_online
    # Drupal CMS admin UI.
    gin:
      - block.block.gin_breadcrumbs
      - block.block.gin_content
      - block.block.gin_local_actions
      - block.block.gin_messages
      - block.block.gin_page_title
      - block.block.gin_primary_local_tasks
      - block.block.gin_secondary_local_tasks
    # Optional config is not installed by recipes: the default profile and the
    # text format of Display Builder.
    display_builder:
      - display_builder.profile.default
      - filter.format.display_builder_html
    webform:
      - webform.webform.contact
  actions:
    system.theme:
      simpleConfigUpdate:
        default: ui_suite_uikit
        admin: gin
    system.site:
      simpleConfigUpdate:
        slogan: 'Built with Display Builder and UIkit'
        page.front: /node
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    user.settings:
      simpleConfigUpdate:
        verify_mail: true
        register: admin_only
        cancel_method: user_cancel_block
    user.role.anonymous:
      grantPermission: 'access content'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'delete own files'
        - 'access administration pages'
        - 'access coffee'
        - 'access contextual links'
        - 'view the administration theme'
    user.role.content_editor:
      grantPermissions:
        - 'access content overview'
        - 'access contextual links'
        - 'access files overview'
        - 'administer url aliases'
        - 'create terms in tags'
        - 'create url aliases'
        - 'edit terms in tags'
        - 'delete own files'
        - 'revert all revisions'
        - 'view all revisions'
        - 'view the administration theme'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete %bundle revisions'
        - 'delete own %bundle content'
        - 'edit own %bundle content'
    announcements_feed.settings:
      simpleConfigUpdate:
        limit: 2
    automatic_updates.settings:
      simpleConfigUpdate:
        allow_core_minor_updates: true
    core.menu.static_menu_link_overrides:
      overrideMenuLinks:
        announcements_feed.announcement:
          enabled: false
    drupical.settings:
      simpleConfigUpdate:
        limit: 5
    gin_login.settings:
      simpleConfigUpdate:
        brand_image:
          use_default: false
          # The file entity of the login wallpaper ships in content/file.
          path: public://login-wallpaper.png
    project_browser.admin_settings:
      simpleConfigUpdate:
        allow_ui_install: true
        max_selections: 1
    tagify.settings:
      simpleConfigUpdate:
        set_default_widget: true
    update.settings:
      simpleConfigUpdate:
        check.disabled_extensions: true
    # The demo video is a WebM file. Set through the field API, so the demo
    # content imported next validates against the new extensions.
    field.field.media.video.field_media_video_file:
      setSettings:
        file_extensions: 'mp4 webm'
    # Media embedded in the body of the demo content (<drupal-media>).
    filter.format.full_html:
      setFilterConfig:
        instance_id: media_embed
        configuration:
          id: media_embed
          provider: media
          status: true
          weight: 100
          settings:
            default_view_mode: default
            allowed_view_modes: {  }
            allowed_media_types: {  }
    # The contact form of the Webship profile.
    webform.webform.contact:
      simpleConfigUpdate:
        description: '<p>Contact us.</p>'
        third_party_settings:
          antibot:
            antibot: true
          honeypot:
            honeypot: true
            time_restriction: true
        elements: |-
          contact_paragraph:
            '#type': webform_markup
            '#markup': "<h3>We'd love to talk to you</h3><p>Leave us your details and we will contact you soon.</p>"
          layout_1:
            '#type': webform_flexbox
            name:
              '#type': textfield
              '#title': 'Your Name'
              '#placeholder': 'Your full name'
              '#required': true
              '#default_value': '[current-user:display-name]'
            company_name:
              '#type': textfield
              '#title': 'Company name'
              '#placeholder': 'Your company name'
          layout_2:
            '#type': webform_flexbox
            email:
              '#type': email
              '#title': 'Business email'
              '#placeholder': 'Your business email'
              '#required': true
              '#default_value': '[current-user:mail]'
            phone_number:
              '#type': textfield
              '#title': 'Phone number'
              '#placeholder': 'Your phone number'
          message:
            '#type': textarea
            '#title': 'Your message'
            '#placeholder': 'Your message'
            '#required': true
          privacy:
            '#type': webform_markup
            '#markup': '<p>By contacting us through this form, you agree to our <a href="/privacy">Privacy policy</a>.</p>'
          actions:
            '#type': webform_actions
            '#title': 'Submit button(s)'
            '#submit__label': Submit
    # Full Web Blog post: a UIkit Article.
    core.entity_view_display.node.webblog.full:
      setThirdPartySettings:
        - module: display_builder
          key: profile
          value: default
        - module: display_builder
          key: sources
          value:
            - source_id: component
              source:
                component:
                  component_id: 'ui_suite_uikit:article'
                  variant_id: null
                  props: {  }
                  slots:
                    meta:
                      sources:
                        - source_id: token
                          source:
                            value: 'By [node:author:display-name] on [node:created:medium]'
                    content:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:field_media'
                            'field:node:webblog:field_media':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:field_media'
                                    source:
                                      type: entity_reference_entity_view
                                      label: hidden
                                      settings:
                                        view_mode: ultrawide
                                      third_party_settings: {  }
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:body'
                            'field:node:webblog:body':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:body'
                                    source:
                                      type: text_default
                                      label: hidden
                                      settings: {  }
                                      third_party_settings: {  }
    # Web Blog teaser: a UIkit Card with the image on the left.
    core.entity_view_display.node.webblog.teaser:
      setThirdPartySettings:
        - module: display_builder
          key: profile
          value: default
        - module: display_builder
          key: sources
          value:
            - source_id: component
              source:
                component:
                  component_id: 'ui_suite_uikit:card'
                  variant_id:
                    source_id: select
                    source:
                      value: default
                  props:
                    image_position:
                      source_id: select
                      source:
                        value: left
                    hover:
                      source_id: checkbox
                      source:
                        value: true
                    attributes:
                      source_id: attributes
                      source:
                        value: 'class="uk-margin-medium-bottom"'
                  slots:
                    image:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:field_media'
                            'field:node:webblog:field_media':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:field_media'
                                    source:
                                      type: entity_reference_entity_view
                                      label: hidden
                                      settings:
                                        view_mode: standard
                                      third_party_settings: {  }
                    title:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:title'
                            'field:node:webblog:title':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:title'
                                    source:
                                      type: string
                                      label: hidden
                                      settings:
                                        link_to_entity: true
                                      third_party_settings: {  }
                    content:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:created'
                            'field:node:webblog:created':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:created'
                                    source:
                                      type: timestamp
                                      label: hidden
                                      settings:
                                        date_format: medium
                                        custom_date_format: ''
                                        timezone: ''
                                      third_party_settings: {  }
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:body'
                            'field:node:webblog:body':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:body'
                                    source:
                                      type: text_summary_or_trimmed
                                      label: hidden
                                      settings:
                                        trim_length: 200
                                      third_party_settings: {  }
                        - source_id: component
                          source:
                            component:
                              component_id: 'ui_suite_uikit:button'
                              variant_id:
                                source_id: select
                                source:
                                  value: text
                              props:
                                url:
                                  source_id: entity_link
                                  source:
                                    template: canonical
                                    absolute: false
                              slots:
                                label:
                                  sources:
                                    - source_id: textfield
                                      source:
                                        value: 'Read more'
