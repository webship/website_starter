  body:
  - value: '<p class="uk-text-lead">With the HTMX navigation, only the page wrapper is swapped when a link is followed.</p><p>The HTMX navigation boosts the links of the page with Drupal core HTMX: only the page wrapper is swapped. Core loads the new CSS and JavaScript, merges <code>drupalSettings</code> and attaches the behaviors.</p><p>Forms, administration pages, files, contextual and dialog links keep the normal navigation. The focus moves to the main content and the new page title is announced to screen readers.</p>'
