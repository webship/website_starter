name: 'Website Starter'
description: 'A website built with Display Builder and the UI Suite UIkit design system: page layout, Webpage and Web Blog content displays, contact webform, menus, a UIkit showcase and demo content. No Canvas, no Layout Builder.'
type: 'Site'
# Site template metadata for the Webship installer.
extra:
  webship_installer:
    creator: 'Webship'
# A site template works on its own: it applies the default recipes of the
# Webship modules, Web Dashboard and core recipes, never another site template.
recipes:
  # Webship content types and media, before the roles: the roles reference
  # their permissions. Webpage first: it installs Node.
  - modules/contrib/webpage/recipes/default
  - modules/contrib/webassets/recipes/default
  - modules/contrib/webdev/recipes/default
  - modules/contrib/webblog/recipes/default
  - core/recipes/tags_taxonomy
  # The core recipes of the text formats, the themes, the roles and the
  # recommended settings.
  - core/recipes/basic_block_type
  - core/recipes/basic_html_format_editor
  - core/recipes/full_html_format_editor
  - core/recipes/core_recommended_performance
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_admin_theme
  - core/recipes/core_recommended_front_end_theme
  - core/recipes/user_picture
  - core/recipes/restricted_html_format
  - core/recipes/administrator_role
  - core/recipes/content_editor_role
  # The Webship administration, SEO and security features. Web Admin comes
  # after the core admin theme recipe: it sets Gin as the admin theme.
  - modules/contrib/webadmin/recipes/default
  - modules/contrib/webseo/recipes/default
  - modules/contrib/websecurity/recipes/default
  # The default dashboards of the Webship site templates, built with Display
  # Builder: Webmaster for site administrators, Editorial for content editors.
  - webdash
  # Webship features: editor and configuration management.
  - modules/contrib/webeditor/recipes/default
  - modules/contrib/webconfig/recipes/default
install:
  # Theme.
  - ui_suite_uikit
config:
  strict: false
  import:
    olivero:
      - block.block.olivero_help
  actions:
    system.theme:
      simpleConfigUpdate:
        default: ui_suite_uikit
    system.site:
      simpleConfigUpdate:
        slogan: 'Built with Display Builder and UIkit'
        # The Blog page is the front page: its "Blog" title is the main heading.
        page.front: /blog
    user.role.anonymous:
      grantPermission: 'access content'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'delete own files'
    # Content editors manage the content of every content type of the site,
    # and move content through the editorial workflow.
    user.role.content_editor:
      grantPermissions:
        - 'access content overview'
        - 'access contextual links'
        - 'access files overview'
        - 'administer url aliases'
        - 'create terms in tags'
        - 'create url aliases'
        - 'edit terms in tags'
        - 'delete own files'
        - 'revert all revisions'
        - 'use editorial transition archive'
        - 'use editorial transition archived_draft'
        - 'use editorial transition archived_published'
        - 'use editorial transition create_new_draft'
        - 'use editorial transition publish'
        - 'view all revisions'
        - 'view latest version'
        - 'view the administration theme'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete %bundle revisions'
        - 'delete own %bundle content'
        - 'edit own %bundle content'
    gin_login.settings:
      simpleConfigUpdate:
        brand_image:
          use_default: false
          # The file entity of the login wallpaper ships in content/file.
          path: public://login-wallpaper.png
    # The demo video is a WebM file. Set through the field API, so the demo
    # content imported next validates against the new extensions.
    field.field.media.video.field_media_video_file:
      setSettings:
        file_extensions: 'mp4 webm'
    filter.format.full_html:
      setFilterConfigs:
        # Media embedded in the body of the demo content (<drupal-media>).
        -
          instance_id: media_embed
          configuration:
            id: media_embed
            provider: media
            status: true
            weight: 100
            settings:
              default_view_mode: default
              allowed_view_modes: {  }
              allowed_media_types: {  }
        # Tokens in the demo content, like the year in the footer copyright
        # block ([date:custom:Y]).
        -
          instance_id: token_filter
          configuration:
            id: token_filter
            provider: token_filter
            status: true
            weight: 110
            settings:
              replace_empty: false
    # The Full HTML editor of the site: the core toolbar with the Media button,
    # and complete plugin settings, so the editor passes config validation.
    # The Advanced links plugin gets its own default settings.
    editor.editor.full_html:
      set:
        property_name: settings
        value:
          toolbar:
            items:
              - bold
              - italic
              - strikethrough
              - superscript
              - subscript
              - removeFormat
              - '|'
              - link
              - '|'
              - bulletedList
              - numberedList
              - '|'
              - blockQuote
              - drupalInsertImage
              - drupalMedia
              - insertTable
              - horizontalLine
              - '|'
              - heading
              - codeBlock
              - '|'
              - sourceEditing
          plugins:
            ckeditor5_codeBlock:
              languages:
                - { label: 'Plain text', language: plaintext }
                - { label: C, language: c }
                - { label: 'C#', language: cs }
                - { label: C++, language: cpp }
                - { label: CSS, language: css }
                - { label: Diff, language: diff }
                - { label: HTML, language: html }
                - { label: Java, language: java }
                - { label: JavaScript, language: javascript }
                - { label: PHP, language: php }
                - { label: Python, language: python }
                - { label: Ruby, language: ruby }
                - { label: TypeScript, language: typescript }
                - { label: XML, language: xml }
            ckeditor5_heading:
              enabled_headings:
                - heading2
                - heading3
                - heading4
                - heading5
                - heading6
            ckeditor5_imageResize:
              allow_resize: true
            ckeditor5_list:
              properties:
                reversed: true
                startIndex: true
              multiBlock: true
            ckeditor5_sourceEditing:
              allowed_tags: {  }
            editor_advanced_link_link:
              enabled_attributes: {  }
            # Link suggestions for content, from the default Linkit profile.
            linkit_extension:
              linkit_enabled: true
              linkit_profile: default
            media_media:
              allow_view_mode_override: false
    # The front page shows the Blog page: the browser title of the front page
    # is the site name and slogan.
    metatag.metatag_defaults.front:
      setProperties:
        tags.title: '[site:name] | [site:slogan]'
    # The contact webform of the site: anti-spam protection, and a line that
    # links to the Privacy page of the demo content.
    webform.webform.contact:
      simpleConfigUpdate:
        third_party_settings:
          antibot:
            antibot: true
          honeypot:
            honeypot: true
            time_restriction: true
        elements: |-
          contact_paragraph:
            '#type': webform_markup
            '#markup': "<h3>We'd love to talk to you</h3><p>Leave us your details and we will contact you soon.</p>"
          layout_1:
            '#type': webform_flexbox
            name:
              '#type': textfield
              '#title': 'Your Name'
              '#placeholder': 'Your full name'
              '#required': true
              '#default_value': '[current-user:display-name]'
            company_name:
              '#type': textfield
              '#title': 'Company name'
              '#placeholder': 'Your company name'
          layout_2:
            '#type': webform_flexbox
            email:
              '#type': email
              '#title': 'Business email'
              '#placeholder': 'Your business email'
              '#required': true
              '#default_value': '[current-user:mail]'
            phone_number:
              '#type': textfield
              '#title': 'Phone number'
              '#placeholder': 'Your phone number'
          message:
            '#type': textarea
            '#title': 'Your message'
            '#placeholder': 'Your message'
            '#required': true
          privacy:
            '#type': webform_markup
            '#markup': '<p>By contacting us through this form, you agree to our <a href="/privacy">Privacy policy</a>.</p>'
          actions:
            '#type': webform_actions
            '#title': 'Submit button(s)'
            '#submit__label': Submit
    # Full Web Blog post: a UIkit Article.
    core.entity_view_display.node.webblog.full:
      setThirdPartySettings:
        - module: display_builder
          key: profile
          value: default
        - module: display_builder
          key: sources
          value:
            - source_id: component
              source:
                component:
                  component_id: 'ui_suite_uikit:article'
                  variant_id: null
                  props: {  }
                  slots:
                    meta:
                      sources:
                        - source_id: token
                          source:
                            value: 'By [node:author:display-name] on [node:created:medium]'
                    content:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:field_media'
                            'field:node:webblog:field_media':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:field_media'
                                    source:
                                      type: entity_reference_entity_view
                                      label: hidden
                                      settings:
                                        view_mode: ultrawide
                                      third_party_settings: {  }
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:body'
                            'field:node:webblog:body':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:body'
                                    source:
                                      type: text_default
                                      label: hidden
                                      settings: {  }
                                      third_party_settings: {  }
    # Web Blog teaser: a UIkit Card with the image on the left.
    core.entity_view_display.node.webblog.teaser:
      setThirdPartySettings:
        - module: display_builder
          key: profile
          value: default
        - module: display_builder
          key: sources
          value:
            - source_id: component
              source:
                component:
                  component_id: 'ui_suite_uikit:card'
                  variant_id:
                    source_id: select
                    source:
                      value: default
                  props:
                    image_position:
                      source_id: select
                      source:
                        value: left
                    hover:
                      source_id: checkbox
                      source:
                        value: true
                    attributes:
                      source_id: attributes
                      source:
                        value: 'class="uk-margin-medium-bottom"'
                  slots:
                    image:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:field_media'
                            'field:node:webblog:field_media':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:field_media'
                                    source:
                                      type: entity_reference_entity_view
                                      label: hidden
                                      settings:
                                        view_mode: standard
                                      third_party_settings: {  }
                    title:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:title'
                            'field:node:webblog:title':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:title'
                                    source:
                                      type: string
                                      label: hidden
                                      settings:
                                        link_to_entity: true
                                      third_party_settings: {  }
                    content:
                      sources:
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:created'
                            'field:node:webblog:created':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:created'
                                    source:
                                      type: timestamp
                                      label: hidden
                                      settings:
                                        date_format: medium
                                        custom_date_format: ''
                                        timezone: ''
                                      third_party_settings: {  }
                        - source_id: entity_field
                          source:
                            derivable_context: 'field:node:webblog:body'
                            'field:node:webblog:body':
                              value:
                                sources:
                                  - source_id: 'field_formatter:node:webblog:body'
                                    source:
                                      type: text_summary_or_trimmed
                                      label: hidden
                                      settings:
                                        trim_length: 200
                                      third_party_settings: {  }
                        - source_id: component
                          source:
                            component:
                              component_id: 'ui_suite_uikit:button'
                              variant_id:
                                source_id: select
                                source:
                                  value: text
                              props:
                                url:
                                  source_id: entity_link
                                  source:
                                    template: canonical
                                    absolute: false
                              slots:
                                label:
                                  sources:
                                    - source_id: textfield
                                      source:
                                        value: 'Read more'
