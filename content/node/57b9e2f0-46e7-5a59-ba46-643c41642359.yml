  body:
  - value: <p class="uk-text-lead">UIkit is loaded from the jsDelivr CDN by default, or from a local copy.</p><p>UIkit 3.25.22 is loaded from the jsDelivr CDN by default. To serve it locally, install the library in <code>web/libraries/uikit</code>, for example with Asset Packagist, and select <em>Local copy</em> in the theme settings.</p>
