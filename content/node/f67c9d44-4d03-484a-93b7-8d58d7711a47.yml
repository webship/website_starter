  body:
    -
      value: '<p class="uk-text-lead">More than 160 SVG icons available in components and editors through UI Icons.</p><h2>Why UIkit fits content-rich websites</h2><p>UIkit is a modular front-end framework with more than sixty components, from navbars and cards to sliders, lightboxes and sortable lists. Every component is written with the same naming conventions, so once an editor or a developer has seen a card, the modal and the tile feel familiar.</p><p>The framework ships its JavaScript as small, self-initializing components. They watch the page for new markup, which means a card inserted by Display Builder, a slide loaded by HTMX or a modal rendered by a view starts working immediately, without any glue code in the theme.</p><p>Because the look is driven by a handful of global variables — colors, fonts, borders, spacing — a brand can be applied in minutes. The UI Suite UIkit theme exposes those variables as CSS custom properties, so the brand can even be changed from the administration interface.</p><ul><li>Consistent class names for every component</li><li>Components that initialize themselves after any DOM change</li><li>Responsive utilities for width, visibility and spacing</li><li>An icon set of more than 160 SVG icons</li></ul><h2>Fast by default</h2><p>The theme adds almost no CSS or JavaScript of its own: UIkit is loaded once, the design tokens are a small generated stylesheet, and the components do not depend on jQuery.</p><p>HTMX navigation only swaps the page content, keeping the already loaded assets, while Drupal core loads the new libraries a page may need. Combined with the page cache and responsive images, most page changes feel instant.</p><h2>Design tokens that editors can change</h2><p>A design token is a named decision: the primary background, the muted text color, the border color. In the Website Starter every UIkit color used by the components reads a CSS variable, and the variables are declared for UI Skins.</p><p>Changing the primary color from the CSS variables page recolors the buttons, the active tabs, the links and the progress bars at once. The dark color mode is nothing more than another set of values for the same variables.</p><blockquote><p>Tokens turn a style guide into something a site builder can actually use.</p><footer>A front-end lead, after the first brand workshop</footer></blockquote><h2>Key takeaways</h2><ul><li>Why UIkit fits content-rich websites</li><li>Fast by default</li><li>Design tokens that editors can change</li></ul>'
      format: full_html
      summary: 'More than 160 SVG icons available in components and editors through UI Icons.'
