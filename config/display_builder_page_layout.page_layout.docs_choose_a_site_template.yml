            source:
              value: <p>A site template is a Drupal recipe that builds a complete site. Pick the one that matches your project.</p><table class="uk-table uk-table-divider uk-table-small"><thead><tr><th>Site
                template</th><th>For</th></tr></thead><tbody><tr><td>Website Starter</td><td>A company site or a blog, with a UIkit showcase.</td></tr><tr><td>Webship Starter</td><td>Documentation, products
                and releases, in UI Suite UIkit.</td></tr><tr><td>Webship Portal</td><td>A software portal like Webship.co, in Webtheme.</td></tr></tbody></table>
          - source_id: component
            source:
              component:
                component_id: ui_suite_uikit:heading
                variant_id: null
                props:
                  heading_level:
                    source_id: select
                    source:
                      value: 2
                slots:
                  title:
                    sources:
                    - source_id: textfield
                      source:
                        value: From the installer
          - source_id: textarea
            source:
              value: '<p>Open the site in the browser: the Webship installer lists the site templates. Choose one and continue.</p><img src="/sites/default/files/website-starter/developer-laptop-code.jpg"
                data-entity-type="file" data-entity-uuid="724063e6-624c-5942-a484-8da75d4eb895" width="1800" height="1200" alt="A developer writing code on a laptop." class="uk-border-rounded uk-box-shadow-medium">'
          - source_id: component
            source:
              component:
                component_id: ui_suite_uikit:heading
                variant_id: null
                props:
                  heading_level:
                    source_id: select
                    source:
                      value: 2
                slots:
                  title:
                    sources:
                    - source_id: textfield
                      source:
                        value: With Drush
          - source_id: textarea
            source:
              value: '<p>On the command line, give the path of the site template to the installer:</p><pre><code>ddev drush site:install ../recipes/website_starter -y

                ddev launch</code></pre>'
          - source_id: component
            source:
              component:
                component_id: ui_suite_uikit:button_group
                variant_id: null
                props:
                  attributes:
                    source_id: attributes
                    source:
                      value: 'class="uk-margin-large-top"'
                slots:
                  buttons:
                    sources:
                    - source_id: component
                      source:
                        component:
                          component_id: ui_suite_uikit:button
                          variant_id:
                            source_id: select
                            source:
                              value: default
                          props:
                            url:
                              source_id: url
                              source:
                                value: /docs
                          slots:
                            label:
                              sources:
                              - source_id: textfield
                                source:
                                  value: Back to the documentation
